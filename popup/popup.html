<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabi</title>
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">Tabi <span class="sub">Tab-Vorlage</span></div>
    <label class="switch" title="Schutz aktivieren/deaktivieren">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <section class="profiles" id="profileBox" hidden>
    <div class="profiles-head">Profile <span class="hint">– jedes aktive Profil läuft in eigenen Fenstern</span></div>
    <ul id="profileList" class="profile-list"></ul>
  </section>
  <section class="switch-box" id="closeBox" hidden>
    <div id="closeTitle" class="close-title"></div>
    <label class="chk"><input type="checkbox" id="closeTabs" checked> Seine Pflicht-Tabs schließen (eigene Tabs bleiben offen)</label>
    <div class="switch-actions">
      <button id="closeCancel" class="btn">Abbrechen</button>
      <button id="closeGo" class="btn primary">Profil beenden</button>
    </div>
  </section>

  <section id="state" class="state state-grey">
    <div id="stateTitle" class="state-title">Lade Status …</div>
    <div id="stateDetail" class="state-detail"></div>
  </section>

  <section id="windows" class="windows"></section>

  <div class="actions">
    <button id="restore" class="btn primary">Vorlage jetzt wiederherstellen</button>
  </div>
  <div class="actions secondary">
    <button id="options" class="btn">Vorlage bearbeiten</button>
    <button id="capture" class="btn" title="Aktuelle Fenster, Gruppen und Tabs als Standard übernehmen">Sitzung als Standard …</button>
  </div>

  <footer id="footer" class="footer"></footer>

  <script src="popup.js"></script>
</body>
</html>
